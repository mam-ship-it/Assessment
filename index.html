<style>
:root{--ink:#10343f;--teal:#0e7c86;--teal2:#e3f2f3;--gold:#c8962b;--bg:#f3f6f7;--line:#d6e0e3;--red:#b3362f;--green:#1f7a4d;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:.55em 1em;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button.pri{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ok.on{background:var(--green);border-color:var(--green)}
button.no.on{background:var(--red);border-color:var(--red)}
input,select{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:.55em .8em;min-height:44px;background:#fff}
.top{background:var(--ink);color:#fff;padding:.8em 1.2em;display:flex;align-items:center;gap:1em;justify-content:space-between}
.top b{font-size:1.1em}.top button{background:transparent;color:#fff;border-color:#ffffff55;min-height:36px}
main{max-width:960px;margin:0 auto;padding:1.2em}
h2{margin:.2em 0 .8em;font-size:1.3em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9em}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1em}
.card.btn{text-align:start;display:block;width:100%}
.big{font-size:1.5em;font-weight:700}
.muted{color:#5d7780;font-size:.88em}
.bar{height:8px;border-radius:5px;background:var(--teal2);overflow:hidden;margin:.6em 0 .3em}
.bar i{display:block;height:100%;background:var(--teal)}
.row{display:flex;align-items:center;gap:.7em;padding:.7em 1em;border-bottom:1px solid var(--line);cursor:pointer;background:#fff;width:100%;text-align:start;border-radius:0;min-height:56px}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:.8em}
.row .n{width:2.2em;color:#5d7780}.row .nm{flex:1;min-width:0;font-weight:600;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.5}
.chip{padding:.15em .7em;border-radius:20px;font-size:.85em;background:var(--teal2);white-space:nowrap}
.chip.a{background:#f8e0de;color:var(--red)}.chip.c{background:#dcf1e6;color:var(--green)}
.bar2{display:flex;gap:.7em;flex-wrap:wrap}.bar2>*{flex:1;min-width:130px}
.seg{display:flex;gap:.5em;margin:.6em 0}.seg>button{flex:1}
.modal{position:fixed;inset:0;background:#10343f99;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:1.2em}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.st{min-height:1.6em;font-weight:600;margin:.4em 0}.st.bad{color:var(--red)}.st.good{color:var(--green)}
.sum{background:var(--teal2);border-radius:var(--r);padding:.7em 1em;margin:.8em 0;line-height:1.9}
hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.login{max-width:380px;margin:12vh auto;padding:1.5em}.login h1{margin:0 0 .2em}
label{display:block;margin:.7em 0 .25em;font-weight:600}
.pw{position:relative}.pw input{padding-right:5.2em;padding-left:.7em}.pw button{position:absolute;inset-inline-end:auto;left:auto;right:4px;top:4px;min-height:36px;padding:.2em .7em;background:#eef3f5;border:1px solid #ccd}
.err{color:var(--red);min-height:1.5em;margin-top:.6em}
a.back{background:none;border:0;padding:0;color:var(--teal);font-weight:600;min-height:auto;margin-bottom:.6em}

/* ===== institutional theme ===== */
:root{--ink:#0b2c4a;--teal:#12a5b5;--teal2:#e2f5f7;--gold:#e8a900;--gold2:#ffd54a;--red:#e2231a;--green:#2f9e44;--bg:#f4f8fb;--line:#d5e3ea}
body{background:linear-gradient(180deg,#eaf4f8 0,#f7fafc 240px,#f4f8fb 100%) fixed}
body::after{content:"";position:fixed;inset:auto auto 4vh 3vw;width:min(46vmin,420px);aspect-ratio:1;background:var(--logo) center/contain no-repeat;opacity:.045;pointer-events:none;z-index:0}
main,.top{position:relative;z-index:1}
.top{position:sticky;top:0;z-index:6;background:linear-gradient(110deg,#0b2c4a 0,#0f5c78 60%,#12a5b5 100%);border-bottom:3px solid var(--gold);box-shadow:0 4px 18px #0b2c4a40}
.top::after{content:"";position:absolute;inset:auto 0 -3px 0;height:3px;background:linear-gradient(90deg,transparent,#fff9,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 4s linear infinite}
.brand{display:flex;align-items:center;gap:.8em}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold),0 0 0 6px #ffffff22;animation:glow 3.2s ease-in-out infinite}
.top b{letter-spacing:.2px}
.top button{border-color:#ffffff66;transition:.2s}.top button:hover{background:#ffffff26;transform:translateY(-1px)}
button{transition:transform .15s,box-shadow .2s,background .2s}
button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px #0b2c4a22}
button:active{transform:scale(.98)}
button.pri{background:linear-gradient(135deg,#12a5b5,#0f7f99);border:0;color:#fff;box-shadow:0 3px 10px #12a5b555;position:relative;overflow:hidden}
button.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%)}
button.pri:hover::after{transform:translateX(120%);transition:transform .7s}
button.on{background:linear-gradient(135deg,#0b2c4a,#0f5c78)}
.card{border:1px solid var(--line);border-top:3px solid transparent;box-shadow:0 2px 10px #0b2c4a0f;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .5s both}
.card.btn:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0b2c4a26;border-top-color:var(--gold)}
.grid>*:nth-child(2){animation-delay:.05s}.grid>*:nth-child(3){animation-delay:.1s}.grid>*:nth-child(4){animation-delay:.15s}.grid>*:nth-child(n+5){animation-delay:.2s}
.big{background:linear-gradient(90deg,#0b2c4a,#12a5b5);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{position:relative;padding-inline-start:.7em}h2::before{content:"";position:absolute;inset-inline-start:0;top:.15em;bottom:.15em;width:5px;border-radius:4px;background:linear-gradient(var(--gold),var(--teal))}
.bar{background:#dcecf0}.bar i{background:linear-gradient(90deg,var(--teal),var(--gold));animation:fill 1s ease-out both}
.row{transition:background .15s,padding .15s}.row:hover{background:var(--teal2);padding-inline-start:1.3em}
.list{box-shadow:0 2px 10px #0b2c4a0f}
.chip{font-weight:600}.sum{background:linear-gradient(135deg,#e2f5f7,#fff7dc);border:1px solid #f1e2a8}
.modal{animation:fade .2s both}.sheet{animation:up .3s cubic-bezier(.2,.9,.3,1) both;border-top:4px solid var(--gold)}
.sheet::before{content:"";display:block;width:100%;height:0}
table th{background:linear-gradient(135deg,#0b2c4a,#0f5c78)!important;color:#fff;border-color:#0b2c4a!important}
table tr:nth-child(even) td{background:#f3f9fb}table tr:hover td{background:#fff6d6}
.tw{border-radius:var(--r);box-shadow:0 2px 10px #0b2c4a0f}
.phd{display:none}
/* login */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#0b2c4a,#0f5c78 55%,#12a5b5);display:grid;place-items:center;padding:1em}
.blob{position:absolute;border-radius:50%;filter:blur(30px);will-change:transform;opacity:.55;animation:drift 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:#e8a900;top:-80px;right:-60px}.b2{width:300px;height:300px;background:#e2231a;bottom:-90px;left:-70px;opacity:.35;animation-delay:-5s}.b3{width:260px;height:260px;background:#8dc63f;top:40%;left:55%;opacity:.3;animation-delay:-9s}
.stage .login{position:relative;z-index:1;margin:0;width:100%;max-width:400px;padding:1.6em 1.5em;background:#ffffffeb;border:0;border-top:4px solid var(--gold);border-radius:20px;box-shadow:0 24px 60px #00000055;text-align:center;animation:rise .7s both}
.stage .login label{text-align:start}
.ring{width:128px;height:128px;margin:-70px auto .6em;border-radius:50%;padding:5px;background:conic-gradient(var(--gold),var(--teal),var(--red),var(--gold));animation:spin 8s linear infinite;box-shadow:0 8px 24px #0b2c4a55}
.ring img{width:100%;height:100%;border-radius:50%;background:#fff;display:block;animation:spin 8s linear infinite reverse}
.stage h1{font-size:1.35em;color:var(--ink)}.inst{font-size:.9em;color:#2b5870;font-weight:600;line-height:1.5}
.ecg{width:100%;height:34px;margin:.3em 0}.ecg path{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:ecg 2.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{from{width:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--gold),0 0 0 9px #ffd54a44}}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes drift{50%{transform:translate(40px,30px) scale(1.12)}}
@keyframes ecg{0%{stroke-dashoffset:260}60%,100%{stroke-dashoffset:0}}
@media(max-width:520px){.top{padding:.6em .8em}.brand .muted{display:none}.lg{width:38px;height:38px}}
@media print{body::after,.top{display:none!important}.phd{display:flex!important;align-items:center;gap:1em;border-bottom:3px solid #e8a900;padding-bottom:.5em;margin-bottom:.8em}.phd img{width:70px;height:70px}.phd b{font-size:15px}table th{background:#0b2c4a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== live admin dashboard ===== */
main:has(.dash){max-width:1280px}
.dash{display:grid;gap:1em;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.dc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.1em;box-shadow:0 8px 24px #0b2c4a12;position:relative;overflow:hidden}
.dc h3{margin:0 0 .6em;font-size:1.05em}
.dc.w2{grid-column:span 2}@media(max-width:640px){.dc.w2{grid-column:auto}}
.dnw{position:relative;display:grid;place-items:center;flex:none}
.dnw .mid{position:absolute;font-weight:700;line-height:1.1;text-align:center}
.rg{display:flex;align-items:center;gap:1em}.big2{font-size:1.5em;font-weight:700}
.dv{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.sg{animation:sg 1.3s cubic-bezier(.2,.8,.2,1)}@keyframes sg{from{stroke-dasharray:0 var(--c)}}
.lgd{display:flex;gap:.9em;flex-wrap:wrap;margin-top:.7em;font-size:.9em}.lgd i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:.35em}
.gb{display:grid;grid-template-columns:3.4em 1fr 4.2em;align-items:center;gap:.6em;margin:.5em 0;font-size:.92em}
.gbar{height:11px;border-radius:7px;background:var(--teal2);overflow:hidden}
.bf{display:block;height:100%;border-radius:7px;transition:width 1.3s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,var(--teal),var(--green))}
.gscroll{max-height:390px;overflow:auto;padding-inline-end:.3em}
.flash{animation:fl 1.6s ease-out}@keyframes fl{0%{box-shadow:0 0 0 0 #e8a900cc}100%{box-shadow:0 0 0 20px #e8a90000}}
.live{display:inline-flex;align-items:center;gap:.45em;font-weight:700;color:var(--green)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pls 1.6s infinite}
.live.off{color:#5d7780}.live.off i{background:#9bb0b8;animation:none}
@keyframes pls{0%{box-shadow:0 0 0 0 #2f9e4488}100%{box-shadow:0 0 0 11px #2f9e4400}}
.dhd{display:flex;gap:1em;align-items:center;flex-wrap:wrap;margin:.2em 0 .8em}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:.55em .2em;border-bottom:1px solid var(--line);line-height:1.6;font-size:.92em}
.feed li .muted{display:block}.feed li.new{animation:sl .8s ease-out;background:#fff8dc}
@keyframes sl{from{opacity:0;transform:translateX(-18px)}}
.toastl{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:.55em 1.2em;border-radius:30px;opacity:0;transform:translateY(20px);transition:.4s;z-index:60;pointer-events:none}
.toastl.show{opacity:1;transform:none}
.dsg{gap:.3em;margin:.2em 0 .7em}.dsg button{min-height:34px;padding:.2em .4em;font-size:.82em}
@media(prefers-reduced-motion:reduce){.dv,.bf,.sg,.flash,.live i,.feed li.new{animation:none!important;transition:none!important}}
</style>

document.documentElement.style.setProperty('--logo',`url(${LOGO})`);
{const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l);}
const INST='المعهد الفني للتمريض - جامعة المنصورة';
const $ = s => document.querySelector(s), app = $('#app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TN = {antenatal:'Antenatal',labor:'Labor',postnatal:'Postnatal',lab:'Lab'};
const nat = (a,b) => a.localeCompare(b,undefined,{numeric:true});
const S = {sn:1, wk:1}; let M = {};
const num = k => Number(S.cfg[k]);
const tr = m => /coordinator approval/.test(m) ? 'الطالب غـ في كل الجلسات: يلزم أمر المنسق أولاً'
  : /exceeds|check constraint/.test(m) ? 'القيمة خارج الحد المسموح' : /duplicate/.test(m) ? 'السجل موجود بالفعل' : m;

/* ---------- auth ---------- */
function loginView(msg=''){
  app.innerHTML = `<div class="stage"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><form class="card login" id="lf"><div class="ring"><img src="${LOGO}" alt="شعار المعهد الفني للتمريض"></div><div class="inst">المعهد الفني للتمريض<br>كلية التمريض - جامعة المنصورة</div><svg class="ecg" viewBox="0 0 260 34" aria-hidden="true"><path d="M0 18h70l8-10 10 22 10-28 10 22 8-6h144"/></svg><h1>نظام تقييم التدريب العملي</h1><div class="muted">سجّل الدخول بحسابك</div>
  <label for="em">الاسم</label><input id="em" type="text" autocomplete="username" required>
  <label for="pw">كلمة المرور</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" required dir="ltr"><button type="button" id="sh">إظهار</button></div>
  <div class="err" id="er">${e(msg)}</div><button class="pri" style="width:100%">تسجيل الدخول</button>${crHTML()}</form></div>`;
  $('#sh').onclick = () => { const p=$('#pw'); const h=p.type==='password'; p.type=h?'text':'password'; $('#sh').textContent=h?'إخفاء':'إظهار'; };
  $('#lf').onsubmit = async ev => {
    ev.preventDefault(); $('#er').textContent='جارٍ الدخول...';
    let j={}; try{ const r=await fetch('https://arbgzaiipplvqynpqmch.supabase.co/functions/v1/name-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_dEYMBvGd5cLw09c0z-Fkhg_KIpT4CSJ'},body:JSON.stringify({name:$('#em').value,password:$('#pw').value})}); j=await r.json(); }catch(x){ j={error:'تعذر الاتصال بالخادم'}; }
    if (!j.ok) return $('#er').textContent = j.error||'الاسم أو كلمة المرور غير صحيحة';
    const {error} = await SB.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if (error) $('#er').textContent='فشل تسجيل الدخول'; else boot();
  };
}
const shell = (inner, sub='') => `<div class="top"><div class="brand"><img class="lg" src="${LOGO}" alt="شعار المعهد الفني للتمريض"><div><b>${e(S.me.full_name)}</b><div class="muted" style="color:#cfe6ec">${sub||INST}</div></div></div><div style="display:flex;gap:.4em"><button onclick="goHome()">الرئيسية</button><button onclick="logout()">خروج</button></div></div><main><div class="phd"><img src="${LOGO}" alt=""><div><b>${INST}</b><div>تقييم التدريب العملي - تمريض الأمومة</div><div>${new Date().toLocaleDateString('ar-EG')}</div></div></div>${inner}${crHTML()}</main>`;
function goHome(){ $('#md')?.remove(); S.me.role==='doctor'?home():staffView(S.tab||'sum'); }
async function logout(){ await SB.auth.signOut(); S.me=null; loginView(); }

async function boot(){
  const user=await offUser(); if(!user) return loginView();
  const [d,a,st,p] = await Promise.all([
    SB.from('doctors').select('*').eq('user_id',user.id).maybeSingle(),
    SB.from('doctor_group_assignments').select('group_code,training_type_code'),
    SB.from('assessment_settings').select('key,value'),
    SB.from('training_periods').select('*').eq('is_open',true).order('id').limit(1)]);
  if (!d.data && d.error && isNet(d.error.message)) return loginView('لا يوجد اتصال ولا توجد بيانات محفوظة على هذا الجهاز. اتصل بالإنترنت مرة واحدة على الأقل ثم أعد المحاولة.');
  if (!d.data || !d.data.active){ await SB.auth.signOut(); return loginView('الحساب غير مفعّل. تواصل مع مدير النظام.'); }
  S.me=d.data; S.assign=a.data||[]; S.period=(p.data||[])[0];
  S.cfg=Object.fromEntries((st.data||[]).map(x=>[x.key,x.value]));
  if (S.me.role!=='doctor'){ return staffView('sum'); }
  home();
}

/* ---------- doctor: sheet type ---------- */
function home(){
  const types=[...new Set(S.assign.map(x=>x.training_type_code))].sort((a,b)=>['antenatal','labor','postnatal','lab'].indexOf(a)-['antenatal','labor','postnatal','lab'].indexOf(b));
  const cards=types.map(t=>{const n=S.assign.filter(x=>x.training_type_code===t).length;
    return `<button class="card btn" onclick="groupsView('${t}')"><div class="big">${TN[t]}</div><div class="muted">${n} مجموعة</div></button>`}).join('');
  app.innerHTML = shell(`<h2>اختر نوع الشيت</h2>`+(types.length?`<div class="grid">${cards}</div>`:'<div class="card">لم تُسند إليك مجموعات بعد. تواصل مع المنسق.</div>'),
    S.period?e(S.period.name):'لا توجد فترة تدريبية مفتوحة');
}

/* ---------- doctor: groups ---------- */
async function groupsView(t){
  S.t=t; const lab=t==='lab';
  const gs=S.assign.filter(x=>x.training_type_code===t).map(x=>x.group_code).sort(nat);

/* ---------- saving (never reports success before the DB confirms) ---------- */
const isNet=m=>!navigator.onLine||/failed to fetch|networkerror|load failed|network request|timeout|fetch/i.test(String(m||''));
const withTO=(p,ms=15000)=>Promise.race([p,new Promise(r=>setTimeout(()=>r({error:{message:'timeout'}}),ms))]);
async function ensureSession(){
  if(S.g.sess){ S.ps=null; return S.g.sess; }
  const lab=S.t==='lab', row={group_code:S.g.gc, period_id:S.period.id, week_no:S.wk, session_no:S.sn, doctor_id:S.me.user_id, session_date:new Date().toLocaleDateString('en-CA')};
  if(!lab) row.training_type_code=S.t;
  const r=await withTO(SB.from(lab?'lab_sessions':'clinical_sessions').insert(row).select().single());
  if(r.error){
    if(isNet(r.error.message)){ S.ps=row; return {id:null,_pending:true}; }
    msg('فشل الحفظ: '+tr(r.error.message),'bad'); return null; }
  S.ps=null; S.g.sess=r.data; S.g.sessions.push(r.data); return r.data;
}
async function write(table, ex, row, key, store){
  if(S.busy) return; S.busy=true;
  try{
    msg('جارٍ الحفظ...');
    const ps=(table==='clinical_assessments'||table==='lab_assessments')?S.ps:null;
    const ctx=[table,ex?.student_code||row.student_code,ex?.session_id||row.session_id||(ps?[S.g.gc,S.t,S.sn].join(':'):''),ex?.quiz_no||row.quiz_no||'',ex?.period_id||row.period_id||'',ex?.training_type_code||row.training_type_code||''].join('|');
    if((ex&&ex._pending)||(ps&&!ex)) return await queueOp(ctx,table,ex,row,ps,store);
    let r = ex ? await withTO(SB.from(table).update(row).eq('id',ex.id).eq('version',ex.version).select())
               : await withTO(SB.from(table).insert(row).select());
    if (r.error){
      if(isNet(r.error.message)) return await queueOp(ctx,table,ex,row,null,store);
      return msg('فشل الحفظ: '+tr(r.error.message)+' - البيانات المدخلة ما زالت أمامك','bad'); }
    if (!r.data.length) return msg('تم تعديل هذا السجل من مستخدم آخر. أغلق البطاقة وافتحها من جديد.','bad');
    store(r.data[0]); await loadSummary(M.code); drawStu(); msg('تم الحفظ على الخادم بنجاح','good');
  } finally { S.busy=false; }
}
async function saveC(){
  if(!M.st) return msg('اختر حاضر أو غائب','bad');
  if(M.st==='present' && M.bg===null) return msg('اختر السلوك','bad');
  if(M.st==='present' && M.ug==null) return msg('اختر اليونيفورم','bad');
  const sess=await ensureSession(); if(!sess) return; const pr=M.st==='present';
  const row={status:M.st, attendance_score:pr?num('clinical.attendance_max'):null, behavior_good:pr?M.bg:null,
             behavior_score:pr?(M.bg?num('clinical.behavior_max'):0):null, uniform_score:pr?(M.ug?num('clinical.uniform_max'):0):null, sick_excuse:pr?false:!!S.g.ass[M.code]?.sick_excuse, makeup_done:!pr&&!!S.g.ass[M.code]?.makeup_done, makeup_date:pr?null:(S.g.ass[M.code]?.makeup_date||null)};
  const ex=S.g.ass[M.code];
  await write('clinical_assessments',ex,ex?row:{...row,session_id:sess.id,student_code:M.code},0,x=>{S.g.ass[M.code]=x;S.g.all[M.code+'|'+S.sn]=x;});
}
async function saveSheet(){
  if(pendMk().length) return msg('لا يمكن إدخال درجة الشيت قبل تعويض الغياب','bad');
  const v=parseFloat(M.sheet), mx=num('clinical.sheet_max');

    return `${act==='INSERT'?'أضاف':act==='DELETE'?'حذف':'عدّل'} سجلًا في ${t}`;

  const fmt=x=>new Date(x).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'medium',timeStyle:'short'});

}

async function doMove(){
  if(S.me.role!=='admin') return;
  const dest=$('#mvg')?.value, codes=[...(S.sel||[])], m=$('#mvm'), go=$('#mvgo'); let done=0, skipped=[];
  if(!dest||!codes.length){m.textContent='اختر المجموعة الجديدة';m.className='st bad';return;}
  go.disabled=true; m.textContent='جارٍ التحقق...'; m.className='st';
  try{
    const rs=await Promise.all(REC.map(t=>SB.from(t).select('student_code').in('student_code',codes).limit(5000)));
    const bad=rs.find(r=>r.error); if(bad) throw bad.error;
    const have=new Set(); rs.forEach(r=>r.data.forEach(x=>have.add(x.student_code)));
    skipped=S.st.stu.filter(x=>codes.includes(x.student_code)&&have.has(x.student_code)).map(x=>x.full_name);
    const order=S.st.stu.filter(x=>codes.includes(x.student_code)&&!have.has(x.student_code)).sort((a,b)=>a.serial_no-b.serial_no);
    if(!order.length) throw new Error('كل الطلاب المحددين لديهم تقييمات مسجّلة ولا يمكن نقلهم');
    const r0=await SB.from('students').select('serial_no').eq('group_code',dest).order('serial_no',{ascending:false}).limit(1);
    if(r0.error) throw r0.error;
    let next=(r0.data[0]?.serial_no||0)+1;
    for(const s of order){
      m.textContent='جارٍ النقل... '+done+' / '+order.length;
      const r=await SB.from('students').update({group_code:dest,serial_no:next,student_code:dest+'-'+next}).eq('student_code',s.student_code).select('student_code');
      if(r.error||!r.data.length) throw new Error('فشل نقل "'+s.full_name+'": '+(r.error?r.error.message:'لا توجد صلاحية'));
      next++; done++;
    }
    $('#mv')?.remove(); S.sel=new Set(); await staffView('stu'); flash('تم نقل '+done+' طالب إلى المجموعة '+dest+(skipped.length?' - لم يُنقل لوجود تقييمات مسجّلة: '+skipped.join('، '):''),skipped.length?'bad':'good');
  }catch(er){
    const t='فشل: '+(er.message||er)+(done?' (تم نقل '+done+' قبل الفشل)':'');
    if(done){ $('#mv')?.remove(); S.sel=new Set(); await staffView('stu'); flash(t,'bad'); }
    else{ const mm=$('#mvm'); if(mm){mm.textContent=t;mm.className='st bad';} const g=$('#mvgo'); if(g) g.disabled=false; }
  }
}

}

/* ---------- offline queue (IndexedDB) + sync ---------- */
const IDBP=new Promise((res,rej)=>{const q=indexedDB.open('nq-v1',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('ops'))d.createObjectStore('ops',{keyPath:'id'});if(!d.objectStoreNames.contains('reads'))d.createObjectStore('reads',{keyPath:'k'});};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const tx=async(m,f)=>{const d=await IDBP;return new Promise((res,rej)=>{const t=d.transaction('ops',m),r=f(t.objectStore('ops'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);});};
const opsAll=()=>tx('readonly',o=>o.getAll());
const opPut=x=>tx('readwrite',o=>o.put(x));
const opDel=id=>tx('readwrite',o=>o.delete(id));
let syncing=false;
async function queueOp(ctx,table,ex,row,ps,store){
  try{
    const uid=S.me.user_id, old=(await opsAll()).find(o=>o.ctx===ctx&&o.uid===uid&&o.status!=='conflict');
    const r2={...row}; if(ps) delete r2.session_id;
    let op;
    if(old){ op={...old,row:{...old.row,...r2},status:'pending',err:null}; if(ps&&!op.sessRow) op.sessRow=ps; }
    else op={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),ctx,uid,table,kind:(ex&&ex.id!=null)?'update':'insert',rowId:ex?.id,ver:ex?.version,row:r2,sessRow:ps||null,createdAt:Date.now(),status:'pending'};
    await opPut(op);
    store({...(ex||{}),...row,_pending:true}); drawStu(); bar();
    msg('تم حفظ التقييم على هذا الجهاز ولم يصل للخادم بعد. سيُرسل تلقائيًا عند توفر الإنترنت','st');
    if(navigator.onLine) setTimeout(sync,3000);
  }catch(er){ msg('تعذر الحفظ على الجهاز: '+(er.message||er)+' - البيانات المدخلة ما زالت أمامك','bad'); }
}
function adopt(row){
  try{ for(const m of [S.g.ass,S.g.all,S.g.sheet,S.g.quiz]) for(const k in m){const v=m[k];
    if(v&&v._pending&&v.student_code===row.student_code&&(!row.session_id||!v.session_id||v.session_id===row.session_id)&&(row.quiz_no==null||v.quiz_no===row.quiz_no)) m[k]=row; } }catch(_){}
}
async function conflict(o,row){
  let q=SB.from(o.table).select('*');
  if(o.rowId!=null) q=q.eq('id',o.rowId); else for(const k of ['student_code','session_id','quiz_no','period_id','training_type_code']) if(row[k]!=null) q=q.eq(k,row[k]);
  const r=await withTO(q.maybeSingle()); if(r.error) throw r.error;
  const sv=r.data;
  if(sv&&Object.keys(o.row).every(k=>String(sv[k]??'')===String(o.row[k]??''))){ await opDel(o.id); adopt(sv); return 'ok'; }
  o.status='conflict'; o.server=sv; await opPut(o); return 'next';
}
async function syncOne(o){
  try{
    const row={...o.row};
    if(o.sessRow){
      const sr=o.sessRow, lab=!sr.training_type_code, t=lab?'lab_sessions':'clinical_sessions';
      let q=SB.from(t).select('*').eq('group_code',sr.group_code).eq('period_id',sr.period_id).eq('session_no',sr.session_no); if(!lab) q=q.eq('training_type_code',sr.training_type_code);
      let r=await withTO(q.maybeSingle()); if(r.error) throw r.error;
      if(!r.data){ r=await withTO(SB.from(t).insert(sr).select().single()); if(r.error) throw r.error; }
      row.session_id=r.data.id;
    }
    let r;
    if(o.kind==='update'){
      r=await withTO(SB.from(o.table).update(row).eq('id',o.rowId).eq('version',o.ver).select());
      if(r.error) throw r.error;
      if(!r.data.length) return await conflict(o,row);
    }else{
      r=await withTO(SB.from(o.table).insert(row).select());
      if(r.error){ if(/duplicate/i.test(r.error.message)) return await conflict(o,row); throw r.error; }
    }
    await opDel(o.id); adopt(r.data[0]); return 'ok';
  }catch(er){
    const m=er.message||String(er);
    if(isNet(m)) return 'stop';
    if(/jwt|expired|not authenticated/i.test(m)){ S.auth=true; return 'stop'; }
    o.status='error'; o.err=tr(m); o.tech=m; await opPut(o); return 'next';
  }
}
async function sync(){
  if(syncing||!S.me||!navigator.onLine) return; syncing=true; S.auth=false; bar();
  try{
    const ops=(await opsAll()).filter(o=>o.uid===S.me.user_id&&(o.status==='pending'||o.status==='error')).sort((a,b)=>a.createdAt-b.createdAt);
    let n=0; for(const o of ops){ const r=await syncOne(o); if(r==='ok') n++; if(r==='stop') break; }
    if(n) S.lastSync=new Date();
  }finally{ syncing=false; bar(); }
}

function crHTML(){ return `<div class="credit">${crInner()}</div>`; }
async function loadCredit(){ try{ const r=await SB.from('app_credits').select('key,value'); if(r.error||!r.data||!r.data.length) return; const o={}; r.data.forEach(x=>o[x.key]=x.value); Object.assign(crData(),o); localStorage.setItem('nq_credit',JSON.stringify(o)); document.querySelectorAll('.credit').forEach(el=>el.innerHTML=crInner()); }catch(_){} }
loadCredit();
home=(f=>function(){ f(); try{
  const m=document.querySelector('main'); if(!m||S.me.role!=='doctor') return;
  const pw=+localStorage.getItem('nq_prewarm_'+S.me.user_id)||0, d=document.createElement('div'); d.className='card'; d.style.marginTop='1em';
  d.innerHTML='<b>العمل بدون إنترنت</b><div class="muted">'+(pw?'آخر تجهيز: '+new Date(pw).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'لم يتم التجهيز بعد - اضغط الزر وأنت متصل بالإنترنت')+'</div><button class="pri" style="margin-top:.6em" onclick="prewarm()">تجهيز البيانات للعمل بدون إنترنت</button>';
  m.appendChild(d); }catch(_){} })(home);
const _lo=logout; logout=async function(){ try{const n=(await opsAll()).filter(o=>o.uid===S.me?.user_id).length; if(n&&!confirm('يوجد '+n+' تقييم لم يصل للخادم بعد. هي محفوظة على هذا الجهاز وستُرسل عند الدخول بنفس الحساب مع توفر الإنترنت'+(navigator.onLine?'':'. أنت غير متصل الآن ولن تستطيع الدخول مجددًا قبل عودة الإنترنت')+'. هل تريد الخروج؟')) return;}catch(_){} try{await rclear();}catch(_){} await _lo(); bar(); };
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(_){}

/* ---------- read cache (offline viewing) ---------- */
let rfails=0;
const rtx=async(m,f)=>{const d=await IDBP;return new Promise((res,rej)=>{const t=d.transaction('reads',m),r=f(t.objectStore('reads'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);});};
const rget=k=>rtx('readonly',o=>o.get(k)), rput=x=>rtx('readwrite',o=>o.put(x)), rclear=()=>rtx('readwrite',o=>o.clear());
async function cfetch(input,init){
  const url=typeof input==='string'?input:input.url, method=((init&&init.method)||(typeof input!=='string'&&input.method)||'GET').toUpperCase();
  if(method!=='GET'||!url.includes('/rest/v1/')) return fetch(input,init);
  const h=new Headers((init&&init.headers)||(typeof input!=='string'?input.headers:{})||{});
  const key=(S.uid||'')+'|'+(h.get('accept')||'')+'|'+(h.get('prefer')||'')+'|'+url;
  try{
    const r=await Promise.race([fetch(input,init),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),10000))]);
    if(r.ok){ r.clone().text().then(body=>rput({k:key,body,status:r.status,ct:r.headers.get('content-type'),cr:r.headers.get('content-range'),at:Date.now()})).catch(()=>{}); if(S.stale){S.stale=null;bar();} }
    return r;
  }catch(er){
    rfails++;
    const c=await rget(key).catch(()=>null);
    if(c){ S.stale=c.at; bar(); const hd={'content-type':c.ct||'application/json'}; if(c.cr) hd['content-range']=c.cr; return new Response(c.status===204?null:c.body,{status:c.status,headers:hd}); }
    throw er;
  }
}
async function offUser(){
  try{ const {data:{session}}=await SB.auth.getSession(); if(session){S.uid=session.user.id;return session.user;} }catch(_){}
  if(!navigator.onLine){ try{ for(const k of Object.keys(localStorage)) if(/^sb-.*-auth-token$/.test(k)){ const j=JSON.parse(localStorage.getItem(k)); const u=j&&(j.user||(j.currentSession&&j.currentSession.user)); if(u){S.uid=u.id;return u;} } }catch(_){} }
  return null;
}
async function overlay(){
  try{
    if(!S.g||!S.me) return; const lab=S.t==='lab', gc=S.g.gc;
    for(const o of (await opsAll()).filter(x=>x.uid===S.me.user_id&&x.status!=='conflict')){
      const r=o.row, code=r.student_code; if(!code||!S.g.stu.some(x=>x.student_code===code)) continue;
      const mk=old=>({...(old||{}),...r,_pending:true});
      if(o.table==='clinical_assessments'||o.table==='lab_assessments'){
        const sr=o.sessRow, hit=sr?(sr.group_code===gc&&sr.session_no===S.sn&&(lab||sr.training_type_code===S.t)):(S.g.sess&&r.session_id===S.g.sess.id);
        if(!hit) continue; const x=mk(S.g.ass[code]); S.g.ass[code]=x; if(!lab) S.g.all[code+'|'+S.sn]=x;
      }else if(o.table==='clinical_sheet_scores'){ if(r.training_type_code===S.t||!r.training_type_code) S.g.sheet[code]=mk(S.g.sheet[code]); }
      else if(o.table==='lab_quizzes') S.g.quiz[code+'|'+r.quiz_no]=mk(S.g.quiz[code+'|'+r.quiz_no]);
    }
  }catch(_){}
}
loadGroup=(f=>async function(){ await f(); await overlay(); })(loadGroup);
async function prewarm(auto){
  if(!navigator.onLine||!S.me||!S.period) return auto?0:alert('يلزم اتصال بالإنترنت لتجهيز البيانات');
  const ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:#10343fdd;color:#fff;z-index:10001;display:flex;align-items:center;justify-content:center;font:700 18px Cairo,sans-serif;text-align:center;padding:20px'; document.body.appendChild(ov);
  ov.innerHTML='<div><div id="pwt"></div><div style="font-size:13px;font-weight:400;margin-top:8px">يتم تحميل بيانات مجموعاتك لتعمل بدون إنترنت</div><button id="pwk" style="margin-top:14px;color:#10343f">تخطي</button></div>'; S.skipPW=false; ov.querySelector('#pwk').onclick=()=>{S.skipPW=true;};
  const keep={g:S.g,t:S.t,sn:S.sn}, f0=rfails, p=S.period.id, types=new Set(), jobs=S.assign.slice(); let i=0;
  try{
    for(const a of jobs){
      i++; if(S.skipPW) break; {const pt=ov.querySelector('#pwt'); if(pt) pt.textContent='جارٍ تجهيز بياناتك للعمل دون إنترنت... '+i+' / '+jobs.length;}
      const t=a.training_type_code, lab=t==='lab'; S.t=t;
      if(!types.has(t)){ types.add(t); await Promise.all([SB.from('students').select('group_code'),
        lab?SB.from('v_lab_summary').select('group_code,status').eq('period_id',p):SB.from('v_clinical_summary').select('group_code,status').eq('period_id',p).eq('training_type_code',t)]); }
      S.g={gc:a.group_code}; S.sn=1; await loadGroup();
      if(lab){ const n=num('lab.sessions'); for(let k=2;k<=n;k++){ S.sn=k; await loadGroup(); } }
    }
  }finally{ S.g=keep.g; S.t=keep.t; S.sn=keep.sn; ov.remove(); }
  if(S.skipPW){}
  else if(rfails>f0){ if(!auto) alert('لم يكتمل التجهيز بسبب ضعف الاتصال. أعد المحاولة عند توفر إنترنت أفضل.'); }
  else{ localStorage.setItem('nq_prewarm_'+S.me.user_id,String(Date.now())); if(!auto) alert('تم تجهيز بياناتك. يمكنك الآن فتح المجموعات والتقييم دون إنترنت.'); }
  if(!S.g&&S.me.role==='doctor') home();
}
(async()=>{ (await offUser())?boot():loginView(); })();
